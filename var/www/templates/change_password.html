<!DOCTYPE html>

<html>
<head>
	 <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
	<title>Null Anonymity</title>
	<link rel="icon" href="{{ url_for('static', filename='image/ail-icon.png')}}">
	<!-- Core CSS -->
	<link href="{{ url_for('static', filename='css/bootstrap4.min.css') }}" rel="stylesheet">
	<link href="{{ url_for('static', filename='css/font-awesome.min.css') }}" rel="stylesheet">
	<link href="{{ url_for('static', filename='css/modern-ui.css') }}" rel="stylesheet">

	<!-- JS -->
	<script src="{{ url_for('static', filename='js/jquery.js')}}"></script>
	<script src="{{ url_for('static', filename='js/bootstrap4.min.js')}}"></script>


	<style>
	html, body { height: 100%; }
	body { display: flex; flex-direction: column; background: var(--page); }
	.na-auth-strip {
		display: flex; align-items: center; gap: 14px; padding: 6px 18px;
		background: var(--band); border-bottom: 1px solid var(--line);
		font-size: var(--t-xs); color: var(--muted);
	}
	.na-auth-wrap { flex: 1; display: grid; place-items: center; padding: 32px 16px; }
	.form-signin {
		width: 100%; max-width: 400px; text-align: left;
		background: var(--panel); border: 1px solid var(--line);
		border-radius: 2px; padding: 26px 28px 24px;
	}
	.na-auth-seal { display: flex; align-items: center; gap: 11px; margin-bottom: 20px; }
	.form-signin h1 { font-size: var(--t-b); font-weight: 600; margin: 0 0 16px; }
	.form-signin .form-control { margin-bottom: 13px; }
	.form-signin .btn-primary { width: 100%; }
	.form-signin h5 { font-size: var(--t-sm); font-weight: 600; margin: 22px 0 9px; }
	.form-signin .list-group-item { font-size: var(--t-xs); padding: 8px 12px; }
	</style>

</head>

<body>

<div class="na-auth-strip">
	<span class="na-class-mark">Restricted</span>
	<span>Authorised investigative use only.</span>
</div>

<div class="na-auth-wrap">
				<form class="form-signin" action="{{ url_for('root.change_password')}}" autocomplete="off" method="post">
					<div class="na-auth-seal">
						<svg width="34" height="34" viewBox="0 0 28 28" fill="none" aria-hidden="true">
							<rect x="2.5" y="2.5" width="23" height="23" stroke="#7B828A"/>
							<rect x="6.5" y="6.5" width="15" height="15" stroke="#B8BCC0"/>
							<path d="M14 9.6a2.7 2.7 0 0 1 2.7 2.7v1.1h1v5.2h-7.4v-5.2h1v-1.1A2.7 2.7 0 0 1 14 9.6zm0 1.5a1.2 1.2 0 0 0-1.2 1.2v1.1h2.4v-1.1a1.2 1.2 0 0 0-1.2-1.2z" fill="#565C63"/>
						</svg>
						<div>
							<div class="na-seal-name">Null Anonymity</div>
							<div class="na-seal-org">Cyber Forensics Wing</div>
						</div>
					</div>
		      <h1>Change password</h1>
		      <label for="inputPassword1" class="sr-only">Password</label>
		      <input type="password" id="inputPassword1" name="password1" class="form-control {% if error %}is-invalid{% endif %}" placeholder="Password" autocomplete="new-password" required autofocus>
		      <label for="inputPassword2" class="sr-only">Confirm Password</label>
		      <input type="password" id="inputPassword2" name="password2" class="form-control {% if error %}is-invalid{% endif %}" placeholder="Confirm Password"  value="" autocomplete="new-password" required>
					{% if error %}
						<div class="invalid-feedback">
							{{error}}
						</div>
					{% endif %}
					<button class="btn btn-lg btn-primary btn-block" type="submit">Submit</button>

					<br>
					<br>
					<br>
					<h5 class="h3 mb-3 text-secondary">Password Requirements</h5>
					<ul class="list-group">
					 <li class="list-group-item d-flex justify-content-between align-items-center">
						 Minimal length
						 <span class="badge badge-primary badge-pill">10</span>
					 </li>
					 <li class="list-group-item d-flex justify-content-between align-items-center">
						 Upper characters: A-Z
						 <span class="badge badge-primary badge-pill">1</span>
					 </li>
					 <li class="list-group-item d-flex justify-content-between align-items-center">
						 Lower characters: a-z
						 <span class="badge badge-primary badge-pill">1</span>
					 </li>
					 <li class="list-group-item d-flex justify-content-between align-items-center">
						 Digits: 0-9
						 <span class="badge badge-primary badge-pill">2</span>
					 </li>
					 <li class="list-group-item d-flex justify-content-between align-items-center">
						 Maximum length
						 <span class="badge badge-primary badge-pill">100</span>
					 </li>
					</ul>

		    </form>


</div>
</body>
